audio:
  input_device: null      # null = system default; set to int index from `./run.sh mic-test`
  output_device: null
  sample_rate: 16000      # mic capture rate; openWakeWord + Whisper both want 16k
  playback_rate: 24000    # Kokoro outputs 24k
  input_gain: 1.0         # software gain for quiet mics; bump to 4-8 if alsamixer can't get loud enough

wake:
  # Bundled names: alexa | hey_jarvis | hey_mycroft | hey_rhasspy.
  # Or point at a custom-trained .onnx path: wake/hey_dave.onnx (see wake/README.md).
  # Falls back to hey_jarvis if the path doesn't exist.
  model: wake/hey_dave.onnx
  threshold: 0.5
  cooldown_sec: 1.5
  interrupt_vad_threshold: 0.7    # stricter than recorder's so TTS bleed into the mic doesn't self-trip
  interrupt_min_frames: 4         # ~320 ms of consistent speech to trigger barge-in

stt:
  model: large-v3         # faster-whisper model size: tiny|base|small|medium|large-v3|distil-large-v3
  device: cuda
  compute_type: float16
  language: en
  silence_timeout_sec: 1.2   # cut recording after this much trailing silence
  max_utterance_sec: 20
  vad_threshold: 0.3         # Silero VAD speech probability cutoff; lower = catches quieter speech
  whisper_vad_filter: false  # second VAD pass inside Whisper. Off because Recorder already gates.
  initial_prompt: ""         # vocabulary hint, e.g. "Gordon, Black Mesa, Kleiner, Eli Vance" for HL1 names

llm:
  host: http://localhost:11434
  model: gemma4:latest
  system_prompt: ""        # leave blank: identity.md is the model's self-description and it owns it
  vision_keywords: [look, see, show, what is, what's this, describe, in front, camera, webcam]
  context_messages: 8     # number of prior turns kept in history

tts:
  model: F5TTS_v1_Base           # F5-TTS checkpoint
  device: cuda                   # cuda | cpu
  ref_audio: dave.mp3            # reference voice clip for cloning (file path)
  ref_text: |                    # exact transcript of ref_audio (3-15 s of clean speech is best)
    Hey, I'm Dave Mustaine from Megadeth, and this is Cameo.
    I'd like to invite you to send a greeting from me to your friends, such as a birthday
    greeting, a wedding, a Christmas, divorced as fuck, something like that. You know
    what you want to say. Just get creative. Anyways, thanks for reaching out to me.
    Welcome to Cameo, and have a great 2022.
  prewarm: true                  # synthesize a throwaway phrase at startup; first real reply lands fast
  nfe_step: 32                   # diffusion steps; lower = faster / less detail (try 16)
  cfg_strength: 2.0              # classifier-free guidance; higher = stricter clone of ref voice
  speed: 1.0                     # 1.0 matches ref tempo
  cross_fade_duration: 0.15      # crossfade between F5's internal text chunks
  seed:                          # null/empty = random; set int for reproducibility

fx:
  # HL1 tram-PA chain. Off by default so the cloned voice stays clean; flip
  # `enabled: true` if you want the announcer-radio coloration on top.
  enabled: false
  highpass_hz: 300
  lowpass_hz: 3200
  bitcrush_bits: 10
  drive_db: 8
  reverb_room_size: 0.18
  reverb_damping: 0.7
  reverb_wet: 0.14
  reverb_dry: 0.85
  output_gain_db: 2

vision:
  device_index: 0
  width: 1280
  height: 720
  jpeg_quality: 85

memory:
  dir: memory             # holds identity.md, notes.md, memory.md (auto-created)
