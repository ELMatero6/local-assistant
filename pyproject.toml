[project]
name = "local-assistant"
version = "0.1.0"
description = "Local voice assistant: Whisper STT -> Ollama (Gemma) -> F5-TTS voice cloning"
requires-python = ">=3.10,<3.12"
dependencies = [
    "openwakeword>=0.6.0",
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.7",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "httpx>=0.27",
    "opencv-python>=4.10",
    "pillow>=10.3",
    "qwen-tts",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pedalboard>=0.9.12",
    "pyyaml>=6.0",
    "silero-vad>=5.1",
    "rank-bm25>=0.2.2",
    "duckduckgo-search>=6.0",
]

[project.scripts]
local-assistant = "assistant.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
